<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Edit Product</title>
<link rel="stylesheet" href="style.css" />
<script src="script.js" defer></script>
</head>
<body>
<header>
<h1>Product App</h1>
<nav>
<a href="index.html">Home</a> |
<a href="add_product.html">Add Product</a>
</nav>
</header>
<main>
<h2 data-edit-heading>Edit Product</h2>
<form data-edit-product-form>
<label>Name:</label><br />
<input type="text" name="name" value="Phone" required /><br />
<label>Description:</label><br />
<textarea name="description" required>A reliable phone</textarea><br />
<label>Price:</label><br />
<input type="number" name="price" step="0.01" value="300" required /><br />
<p class="form-status" data-form-status aria-live="polite"></p>
<div class="form-actions">
<button type="submit">Save Changes</button>
<a href="index.html">Cancel</a>
</div>
</form>
</main>
</body>
</html>
