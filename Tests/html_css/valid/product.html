{% extends "base.html" %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<div class="product-detail">
    <img src="{{ product.image }}" alt="{{ product.name }}"/>
    <h2>{{ product.name }}</h2>
    <p>{{ product.description }}</p>
    <p>Price: ${{ product.price }}</p>
    <a href="{{ url_for('index') }}">Back to Products</a>
</div>
{% endblock %}
